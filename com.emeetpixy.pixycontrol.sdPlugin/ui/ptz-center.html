<!doctype html>
<html>
  <head lang="en">
    <meta charset="utf-8" />
    <script src="sdpi-components.js"></script>
  </head>
  <body>
    <p style="opacity: 0.7; font-size: 11px; margin: 4px 8px;">
      Resets pan and tilt to the camera's default position and zooms all the way out. No settings needed.
    </p>

    <sdpi-item label="Advanced">
      <details>
        <summary style="cursor: pointer; opacity: 0.8;">UVC target override</summary>
        <sdpi-textfield setting="uvcTarget" placeholder="0x328f:0x00c0"></sdpi-textfield>
      </details>
    </sdpi-item>
  </body>
</html>
